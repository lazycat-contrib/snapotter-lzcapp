version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/community.lazycat.app.snapotter.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: snapotter
build:
  toolchains: []
  run_buildscript: false
images:
  - id: snapotter
    target: service
    service: snapotter
    source: snapotter/snapotter
    channel: stable
    delivery:
      mode: lazycat
stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales:
      - zh
      - en
    retry:
      enabled: false
      max_attempts: 3
      initial_delay: 2s
      max_delay: 30s
    application:
      language: zh
      name: SnapOtter
      source: https://github.com/snapotter-hq/SnapOtter
      source_author: snapotter-hq
  private:
    enabled: true
    skip_if_version_exists: true
    name: SnapOtter
    summary: Published from GitHub Actions
